document.querySelectorAll(".cta-text").forEach((el) => (el.textContent = c.ctaText));

function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;"); }
const stepsList = $("#stepsList");
c.steps.forEach((s, i) => {
const item = document.createElement("div");
item.className = "step-item";
item.innerHTML = '<div class="step-num">' + (i + 1) + "</div>" +
'<div><div class="step-title"></div><div class="step-desc"></div></div>';
item.querySelector(".step-title").textContent = s.title;
item.querySelector(".step-desc").textContent = s.desc;
stepsList.appendChild(item);
});

'<svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>',
'<svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',

];
const trustBar = $("#trustBar");
c.trust.forEach((t, i) => {
const el = document.createElement("div");
el.className = "trust-item";
el.innerHTML = TRUST_ICONS[i % TRUST_ICONS.length] + "<span></span>";
el.querySelector("span").textContent = t;
trustBar.appendChild(el);
});
let dollarBase = c.counterStart;
const dollarEl = $("#dollarCount");
function updateDollar() {
dollarBase += Math.floor(Math.random() * 80) + 10;
dollarEl.textContent = "$" + dollarBase.toLocaleString();
}
setInterval(updateDollar, 3000);
const notifZone = $("#notifZone");
let notifIdx = 0;
const times = ["just now", "2s ago", "5s ago", "just now", "1s ago", "3s ago",
"just now", "4s ago", "2s ago", "just now", "1s ago", "3s ago"];
function showNotif() {
if(!document.getElementById("page-offer")||!document.getElementById("page-offer").classList.contains("active"))return;
const item = CONFIG.toasts[notifIdx % CONFIG.toasts.length];
const time = times[notifIdx % times.length];
notifIdx++;
const toast = document.createElement("div");
toast.className = "notif-toast";
toast.innerHTML =
'<div class="n-icon"><img alt=""></div>' +
'<div><div class="n-title"></div><div class="n-desc"></div></div>' +
'<div class="n-time"></div>';
toast.querySelector("img").src = ICON_URI;
toast.querySelector(".n-title").textContent = item.n + " earned " + item.a;
toast.querySelector(".n-desc").textContent = item.t;
toast.querySelector(".n-time").textContent = time;
const old = notifZone.querySelector(".notif-toast");
if (old) {
old.classList.add("leaving");
setTimeout(() => { if (old.parentNode) old.remove(); notifZone.appendChild(toast); }, 300);
} else {
notifZone.appendChild(toast);
}
setTimeout(() => {
toast.classList.add("leaving");
setTimeout(() => { if (toast.parentNode) toast.remove(); }, 300);
}, 3500);
}
setTimeout(showNotif, 1500);
(function scheduleNext() {
const delay = 4000 + Math.random() * 2000;
setTimeout(() => { showNotif(); scheduleNext(); }, delay);
})();
const stickyCta = $("#stickyCta");
const mainCta = $("#mainCta");
function handleStickyScroll() {
const rect = mainCta.getBoundingClientRect();
stickyCta.classList.toggle("visible", rect.bottom < 0);
}
window.addEventListener("scroll", handleStickyScroll, { passive: true });
document.querySelectorAll(".trxbutton").forEach((btn) => btn.setAttribute("href", CONFIG.offerUrl));
const searchParams = window.location.search;
if (searchParams) {
const params = searchParams.startsWith("?") ? searchParams.substring(1) : searchParams;
document.querySelectorAll(".trxbutton").forEach((btn) => {
const href = btn.getAttribute("href");
if (href && href !== "#") {
btn.setAttribute("href", href + (href.indexOf("?") !== -1 ? "&" : "?") + params);
}
});
}
let clicked = false;
document.querySelectorAll(".trxbutton").forEach((btn) => {
btn.addEventListener("click", function (e) {
e.preventDefault();
if (clicked) return;
const href = this.getAttribute("href");
if (!href || href === "#") return;
clicked = true;
window.location.href = href;
});
});
})();})();</script>
